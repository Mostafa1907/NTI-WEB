<a class="p-card" [routerLink]="['/products', product.id]">
  <div class="p-card__media">
    
<img [src]="'http://localhost:5000/api/v1/uploads/products/' + product.imageUrl"  [alt]="product.name">
<span class="p-card__cat">{{ categoryLabel() }}</span>
    @if (!product.available) {
    <span class="p-card__oos">Out of stock</span>
    }
  </div>

  <div class="p-card__body">
    <span class="p-card__brand">{{ product.brand }}</span>
    <h3 class="p-card__name">{{ product.name }}</h3>

    <div class="p-card__footer">
      <span class="p-card__price">{{ product.price }} <span class="p-card__cur">EGP</span></span>
      <button type="button" class="p-card__add" [disabled]="!product.available" (click)="onAdd($event)"
        aria-label="Add to cart">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
  </div>
</a>
