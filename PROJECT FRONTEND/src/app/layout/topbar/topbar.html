<header class="topbar">
  <button type="button" class="topbar__burger" (click)="toggleMenu.emit()" aria-label="Open menu">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <div class="topbar__search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7" />
      <path d="M21 21l-4.3-4.3" />
    </svg>
    <input type="text" placeholder="ابحث عن منتج..." (input)="onSearchInput($any($event.target).value)" />
  </div>

  <div class="topbar__actions">
    <a routerLink="/cart" class="topbar__cart">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.4" />
        <circle cx="18" cy="20" r="1.4" />
        <path d="M2.5 3h2l2.4 12.2a2 2 0 002 1.8h8.6a2 2 0 002-1.7L20.5 7H6" />
      </svg>
      <span class="topbar__cart-label">عربتي</span>
      <span class="topbar__cart-badge">{{ cartCount }}</span>
    </a>

    <a routerLink="/profile" class="topbar__profile">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20c1.6-4 5-6 8-6s6.4 2 8 6" />
      </svg>
      <span class="topbar__profile-label">الملف الشخصي</span>
    </a>
  </div>
</header>
